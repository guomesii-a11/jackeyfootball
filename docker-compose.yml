services:
  db:
    image: postgres:16-alpine
    container_name: jackeyfootball-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: jackey
      POSTGRES_PASSWORD: jackey
      POSTGRES_DB: jackeyfootball
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jackey"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
