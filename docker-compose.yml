# JackeyFootball 一键部署（单容器：前端 + 后端 API + SQLite 自动种子）
# 默认使用容器内 SQLite，无需额外数据库服务。
# 如需改用 Postgres，请设置环境变量 DATABASE_URL 并自行添加 db 服务。
services:
  app:
    build: .
    container_name: jackeyfootball
    restart: unless-stopped
    ports:
      - "8080:8000"
    environment:
      # 留空则使用默认 SQLite（./jackeyfootball.db）；填 Postgres 连接串则切换
      DATABASE_URL: ""
